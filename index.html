<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Please Continue with a Smile</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="welcome-page">

        <h1 class="clarify-text">Please Continue with a Smile</h1>

        <p class="subtitle clarify-text">When feelings are meant to unfold</p>

        <div class="character">
            <img src="photo/am i the only one who thinks this looks wrong_.gif" alt="Animated character">
        </div>

        <button class="continue-btn" onclick="continuePage()">
            Continue
        </button>

    </main>

    <script>
        // Canva "Clarify" Staggered Blur Reveal Effect
        document.addEventListener("DOMContentLoaded", () => {
            const clarifyElements = document.querySelectorAll('.clarify-text');

            clarifyElements.forEach((el, elIndex) => {
                const text = el.textContent;
                el.textContent = ''; // Clear existing static text

                // Delay the subtitle slightly so it starts after the main title begins
                const baseDelay = elIndex * 0.4; 

                [...text].forEach((char, charIndex) => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    
                    // Stagger letter animations by 0.035s intervals
                    span.style.animationDelay = `${baseDelay + (charIndex * 0.035)}s`;
                    
                    el.appendChild(span);
                });
            });
        });

        // Redirects directly to html/next.html
        function continuePage() {
            window.location.href = "html/next.html";
        }
    </script>

</body>
</html>
